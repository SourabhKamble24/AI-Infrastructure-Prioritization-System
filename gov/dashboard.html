<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Official Dashboard - CivicTriage</title>
  <link rel="stylesheet" href="../src/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="font-sans antialiased bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 transition-colors duration-300 min-h-screen flex flex-col">
  
  <!-- Navigation -->
  <nav class="glass-nav py-4 px-6 w-full fixed top-0 z-50">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <a href="../index.html" class="flex items-center gap-2">
        <div class="w-8 h-8 rounded bg-primary-600 flex items-center justify-center text-white font-bold text-xl">C</div>
        <span class="font-bold text-xl tracking-tight text-slate-900 dark:text-white">CivicTriage Admin</span>
      </a>
      <div class="flex items-center gap-4">
        <a href="../analytics.html" class="hover:text-primary-600 dark:hover:text-primary-400 font-medium transition-colors hidden md:block mr-2">Analytics</a>
        <a href="../map.html" class="hover:text-primary-600 dark:hover:text-primary-400 font-medium transition-colors hidden md:block mr-4">Live Map</a>
        <button id="theme-toggle" type="button" class="text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 focus:outline-none rounded-lg text-sm p-2.5">
          <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
          <svg id="theme-toggle-light-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path></svg>
        </button>
        <a href="../login.html" class="text-slate-600 dark:text-slate-300 font-medium hover:text-primary-600 dark:hover:text-primary-400">Logout</a>
      </div>
    </div>
  </nav>

  <!-- Dashboard Section -->
  <main class="flex-grow pt-24 pb-12 px-4 max-w-7xl mx-auto w-full">
    <div class="mb-8">
      <h1 class="text-3xl font-bold text-slate-900 dark:text-white">AI Prioritization Queue</h1>
      <p class="text-slate-600 dark:text-slate-400 mt-2">Manage and resolve reported infrastructure issues based on AI severity scoring.</p>
    </div>

    <div class="glass-card overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-600 dark:text-slate-400">
          <thead class="text-xs uppercase bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300">
            <tr>
              <th scope="col" class="px-6 py-4 rounded-tl-lg">ID</th>
              <th scope="col" class="px-6 py-4">Issue</th>
              <th scope="col" class="px-6 py-4">AI Priority</th>
              <th scope="col" class="px-6 py-4">Date Reported</th>
              <th scope="col" class="px-6 py-4">Status</th>
              <th scope="col" class="px-6 py-4 rounded-tr-lg text-right">Action</th>
            </tr>
          </thead>
          <tbody id="govIssuesList" class="divide-y divide-slate-200 dark:divide-slate-700">
            <!-- Dynamically populated rows -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script type="module" src="../src/js/main.js"></script>
  <script type="module">
    import { CATEGORIES } from '../src/js/ai-models.js';

    document.addEventListener('DOMContentLoaded', async () => {
      const token = localStorage.getItem('auth_token');
      if (!token) {
        window.location.href = '../login.html';
        return;
      }

      const issuesContainer = document.getElementById('govIssuesList');
      
      try {
        issuesContainer.innerHTML = '<tr><td colspan="6" class="text-center py-4">Loading issues from backend...</td></tr>';
        
        const response = await fetch('http://localhost:5000/api/complaints');
        if (!response.ok) throw new Error('Failed to fetch');
        
        const issues = await response.json();
        
        // Sort issues exactly by numeric AI severity score
        const sortedIssues = issues.sort((a, b) => b.severity_score - a.severity_score);

      function getPriorityColor(priority) {
        if (priority === 'Critical') return 'text-red-600 dark:text-red-400 bg-red-100 dark:bg-red-900/30';
        if (priority === 'High') return 'text-orange-600 dark:text-orange-400 bg-orange-100 dark:bg-orange-900/30';
        if (priority === 'Medium') return 'text-yellow-600 dark:text-yellow-400 bg-yellow-100 dark:bg-yellow-900/30';
        return 'text-green-600 dark:text-green-400 bg-green-100 dark:bg-green-900/30';
      }
      
        function getStatusBadge(status) {
          if (status === 'resolved') return '<span class="px-3 py-1 text-[10px] font-extrabold tracking-wider rounded-full bg-gradient-to-r from-green-500 to-emerald-400 text-white shadow-sm shadow-green-200 dark:shadow-none uppercase">Resolved</span>';
          if (status === 'in progress') return '<span class="px-3 py-1 text-[10px] font-extrabold tracking-wider rounded-full bg-gradient-to-r from-yellow-500 to-amber-400 text-white shadow-sm shadow-yellow-200 dark:shadow-none uppercase">In Progress</span>';
          return '<span class="px-3 py-1 text-[10px] font-extrabold tracking-wider rounded-full bg-gradient-to-r from-blue-500 to-indigo-400 text-white shadow-sm shadow-blue-200 dark:shadow-none uppercase">Open</span>';
        }

        const html = sortedIssues.map(issue => {
          const catLabel = CATEGORIES.find(c => c.id === issue.category_id)?.label || issue.category_id;
          const shortId = issue.id.split('-')[0].toUpperCase();
          return `
            <tr class="group hover:bg-slate-50/80 dark:hover:bg-slate-800/80 transition-all duration-200 border-b border-slate-100 dark:border-slate-800 last:border-0">
              <td class="px-6 py-5">
                <div class="font-mono text-xs font-bold text-slate-500 bg-slate-100 dark:bg-slate-800 px-2 py-1 rounded inline-block">#${shortId}</div>
              </td>
              <td class="px-6 py-5">
                <div class="font-bold text-slate-900 dark:text-white group-hover:text-primary-600 dark:group-hover:text-primary-400 transition-colors">${catLabel}</div>
                <div class="text-xs text-slate-500 truncate max-w-[200px] mt-1" title="${issue.description}">${issue.description}</div>
              </td>
              <td class="px-6 py-5">
                <div class="flex flex-col gap-1.5 items-start">
                  <span class="px-2.5 py-0.5 text-[11px] font-bold rounded border border-transparent ${getPriorityColor(issue.priority)}">
                    ${issue.priority.toUpperCase()}
                  </span>
                  <div class="flex items-center gap-1 text-[11px] font-semibold text-slate-500 dark:text-slate-400">
                    <svg class="w-3.5 h-3.5 text-primary-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    Score: <span class="text-slate-800 dark:text-slate-200">${issue.severity_score}</span>
                  </div>
                </div>
              </td>
              <td class="px-6 py-5 text-sm font-medium text-slate-600 dark:text-slate-400">
                ${new Date(issue.created_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })}
              </td>
              <td class="px-6 py-5">
                ${getStatusBadge(issue.status)}
              </td>
              <td class="px-6 py-5 text-right">
                <select onchange="updateIssueStatus('${issue.id}', this.value)" class="text-xs font-semibold text-slate-700 bg-white border-2 border-slate-200 hover:border-primary-400 rounded-lg px-3 py-1.5 outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-100 transition-all cursor-pointer shadow-sm">
                  <option value="" disabled selected>Update Status</option>
                  <option value="open">Mark Open</option>
                  <option value="in progress">Mark In Progress</option>
                  <option value="resolved">Mark Resolved</option>
                </select>
              </td>
            </tr>
          `;
        }).join('');
      
      issuesContainer.innerHTML = html;
      } catch (err) {
        console.error(err);
        issuesContainer.innerHTML = '<tr><td colspan="6" class="text-center text-red-500 py-4">Error loading issues. Is the Flask backend running?</td></tr>';
      }
    });

    window.updateIssueStatus = async (id, newStatus) => {
      try {
        const token = localStorage.getItem('auth_token');
        const response = await fetch(`http://localhost:5000/api/complaints/${id}`, {
          method: 'PATCH',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ status: newStatus })
        });
        
        if (response.ok) {
          if (window.showToast) window.showToast(`Issue ${id} marked as ${newStatus.toUpperCase()}`, 'success');
          else alert(`Success: Issue ${id} marked as ${newStatus.toUpperCase()}`);
          setTimeout(() => window.location.reload(), 1500); // Quick refresh for MVP after toast
        } else {
          if (window.showToast) window.showToast('Failed to update status', 'error');
          else alert('Failed to update status');
        }
      } catch (error) {
        console.error('Error:', error);
        if (window.showToast) window.showToast('Network error while updating status', 'error');
        else alert('Network error while updating status');
      }
    };
  </script>
</body>
</html>
