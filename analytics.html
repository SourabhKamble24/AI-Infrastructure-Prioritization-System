<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics Dashboard - CivicTriage</title>
  <link rel="stylesheet" href="./src/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="font-sans antialiased bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 transition-colors duration-300 min-h-screen flex flex-col">
  
  <!-- Navigation -->
  <nav class="glass-nav py-4 px-6 w-full fixed top-0 z-50">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <a href="/index.html" class="flex items-center gap-2">
        <div class="w-8 h-8 rounded bg-primary-600 flex items-center justify-center text-white font-bold text-xl">C</div>
        <span class="font-bold text-xl tracking-tight text-slate-900 dark:text-white">CivicTriage Admin</span>
      </a>
      <div class="flex items-center gap-4">
        <a href="gov/dashboard.html" class="hover:text-primary-600 dark:hover:text-primary-400 font-medium transition-colors hidden md:block mr-2">Admin Queue</a>
        <a href="map.html" class="hover:text-primary-600 dark:hover:text-primary-400 font-medium transition-colors hidden md:block mr-4">Live Map</a>
        <button id="theme-toggle" type="button" class="text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 focus:outline-none rounded-lg text-sm p-2.5">
          <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
          <svg id="theme-toggle-light-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path></svg>
        </button>
        <a href="login.html" class="text-slate-600 dark:text-slate-300 font-medium hover:text-primary-600 dark:hover:text-primary-400">Logout</a>
      </div>
    </div>
  </nav>

  <!-- Analytics Section -->
  <main class="flex-grow pt-24 pb-12 px-4 max-w-7xl mx-auto w-full">
    <div class="mb-8 border-b border-slate-200 dark:border-slate-700 pb-4">
      <h1 class="text-3xl font-bold text-slate-900 dark:text-white">Analytics Overview</h1>
      <p class="text-slate-600 dark:text-slate-400 mt-2">Insights into public infrastructure issues and resolution metrics.</p>
    </div>

    <!-- Summary Cards -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-10">
      <div class="glass-card flex items-center p-6 bg-white dark:bg-slate-800 shadow-sm hover:shadow-md border border-slate-200/60 dark:border-slate-700/50 rounded-2xl transition-all duration-200">
        <div class="w-12 h-12 rounded-full bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400 flex items-center justify-center mr-4">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
        </div>
        <div>
          <span class="block text-slate-500 dark:text-slate-400 text-xs font-semibold uppercase tracking-wider mb-1">Total Issues</span>
          <span class="block text-3xl font-bold text-slate-900 dark:text-white leading-none" id="totalIssues">0</span>
        </div>
      </div>

      <div class="glass-card flex items-center p-6 bg-white dark:bg-slate-800 shadow-sm hover:shadow-md border border-slate-200/60 dark:border-slate-700/50 rounded-2xl transition-all duration-200">
        <div class="w-12 h-12 rounded-full bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-400 flex items-center justify-center mr-4">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
        </div>
        <div>
          <span class="block text-slate-500 dark:text-slate-400 text-xs font-semibold uppercase tracking-wider mb-1">Critical Priority</span>
          <span class="block text-3xl font-bold text-slate-900 dark:text-white leading-none" id="criticalIssues">0</span>
        </div>
      </div>

      <div class="glass-card flex items-center p-6 bg-white dark:bg-slate-800 shadow-sm hover:shadow-md border border-slate-200/60 dark:border-slate-700/50 rounded-2xl transition-all duration-200">
        <div class="w-12 h-12 rounded-full bg-green-50 dark:bg-green-900/20 text-green-600 dark:text-green-400 flex items-center justify-center mr-4">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        </div>
        <div>
          <span class="block text-slate-500 dark:text-slate-400 text-xs font-semibold uppercase tracking-wider mb-1">Resolved</span>
          <span class="block text-3xl font-bold text-slate-900 dark:text-white leading-none" id="resolvedIssues">0</span>
        </div>
      </div>

      <div class="glass-card flex items-center p-6 bg-white dark:bg-slate-800 shadow-sm hover:shadow-md border border-slate-200/60 dark:border-slate-700/50 rounded-2xl transition-all duration-200">
        <div class="w-12 h-12 rounded-full bg-purple-50 dark:bg-purple-900/20 text-purple-600 dark:text-purple-400 flex items-center justify-center mr-4">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        </div>
        <div>
          <span class="block text-slate-500 dark:text-slate-400 text-xs font-semibold uppercase tracking-wider mb-1">Avg Resolution</span>
          <span class="block text-3xl font-bold text-slate-900 dark:text-white leading-none">2.4<span class="text-lg text-slate-400 font-medium ml-1">d</span></span>
        </div>
      </div>
    </div>

    <!-- Charts -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
      <div class="glass-card p-6 bg-white dark:bg-slate-800 shadow-sm border border-slate-200/60 dark:border-slate-700/50 rounded-2xl">
        <h3 class="font-bold text-lg mb-6 text-slate-800 dark:text-white">Issues by Category</h3>
        <div class="relative h-[280px] w-full">
          <canvas id="categoryChart"></canvas>
        </div>
      </div>
      <div class="glass-card p-6 bg-white dark:bg-slate-800 shadow-sm border border-slate-200/60 dark:border-slate-700/50 rounded-2xl">
        <h3 class="font-bold text-lg mb-6 text-slate-800 dark:text-white">Issues by Priority</h3>
        <div class="relative h-[280px] w-full flex justify-center">
          <canvas id="priorityChart"></canvas>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="./src/js/main.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script type="module">
    import { CATEGORIES } from './src/js/ai-models.js';

    document.addEventListener('DOMContentLoaded', async () => {
      let issues = [];
      try {
        const response = await fetch('http://localhost:5000/api/complaints');
        if (response.ok) {
          issues = await response.json();
        }
      } catch (e) {
        console.error("Failed to load analytics data", e);
      }

      // Update summary stats
      document.getElementById('totalIssues').innerText = issues.length;
      document.getElementById('criticalIssues').innerText = issues.filter(i => i.priority === 'Critical').length;
      document.getElementById('resolvedIssues').innerText = issues.filter(i => i.status === 'resolved').length;

      // Prepare data for Category Chart
      const catCounts = {};
      CATEGORIES.forEach(c => catCounts[c.id] = 0);
      issues.forEach(i => { if (catCounts[i.category_id] !== undefined) catCounts[i.category_id]++; });
      
      const catLabels = CATEGORIES.map(c => c.label);
      const catData = CATEGORIES.map(c => catCounts[c.id]);

      // Create a gradient function for the bar chart
      function createGradient(ctx, colorStart, colorEnd) {
        const gradient = ctx.createLinearGradient(0, 0, 0, 400);
        gradient.addColorStop(0, colorStart);
        gradient.addColorStop(1, colorEnd);
        return gradient;
      }

      // Category Bar Chart
      const ctxCat = document.getElementById('categoryChart').getContext('2d');
      
      const barGradients = [
        createGradient(ctxCat, '#3b82f6', '#60a5fa'), // blue
        createGradient(ctxCat, '#8b5cf6', '#a78bfa'), // purple
        createGradient(ctxCat, '#10b981', '#34d399'), // green
        createGradient(ctxCat, '#f59e0b', '#fbbf24'), // orange
        createGradient(ctxCat, '#ef4444', '#f87171')  // red
      ];

      new Chart(ctxCat, {
        type: 'bar',
        data: {
          labels: catLabels,
          datasets: [{
            label: 'Issues',
            data: catData,
            backgroundColor: catData.map((_, i) => barGradients[i % barGradients.length]),
            borderRadius: 6,
            borderSkipped: false,
            barPercentage: 0.5,
            categoryPercentage: 0.8
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: '#1e293b',
              titleFont: { family: 'Inter', size: 13, weight: '600' },
              bodyFont: { family: 'Inter', size: 14 },
              padding: 12,
              cornerRadius: 8,
              displayColors: false,
              callbacks: {
                label: function(context) {
                  return context.parsed.y + ' Issues Reported';
                }
              }
            }
          },
          scales: {
            y: { 
              beginAtZero: true, 
              ticks: { precision: 0, font: { family: 'Inter', size: 11 }, color: '#64748b', padding: 10 },
              grid: { color: '#e2e8f0', drawBorder: false, borderDash: [5, 5] }
            },
            x: {
              ticks: { font: { family: 'Inter', size: 11 }, color: '#64748b', maxRotation: 45, minRotation: 45 },
              grid: { display: false, drawBorder: false }
            }
          },
          animation: {
            y: { duration: 1200, easing: 'easeOutQuart' }
          }
        }
      });

      // Prepare data for Priority Chart
      const priorities = ['Critical', 'High', 'Medium', 'Low'];
      const priorityCounts = [
        issues.filter(i => i.priority === 'Critical').length,
        issues.filter(i => i.priority === 'High').length,
        issues.filter(i => i.priority === 'Medium').length,
        issues.filter(i => i.priority === 'Low').length
      ];

      // Priority Doughnut Chart
      const ctxPri = document.getElementById('priorityChart').getContext('2d');
      new Chart(ctxPri, {
        type: 'doughnut',
        data: {
          labels: priorities,
          datasets: [{
            data: priorityCounts,
            backgroundColor: ['#ef4444', '#f97316', '#eab308', '#22c55e'],
            borderWidth: 3,
            borderColor: '#ffffff', // crisp borders
            hoverOffset: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          cutout: '75%', 
          plugins: {
            legend: { 
              position: 'right',
              labels: { 
                font: { family: 'Inter', size: 12, weight: '500' }, 
                color: '#475569',
                usePointStyle: true, 
                padding: 24,
                boxWidth: 8
              }
            },
            tooltip: {
              backgroundColor: '#1e293b',
              titleFont: { family: 'Inter', size: 13, weight: '600' },
              bodyFont: { family: 'Inter', size: 14 },
              padding: 12,
              cornerRadius: 8,
              callbacks: {
                label: function(context) {
                  return ' ' + context.parsed + ' Issues';
                }
              }
            }
          },
          animation: {
            animateScale: true,
            animateRotate: true,
            duration: 1400,
            easing: 'easeOutBounce'
          }
        }
      });
    });
  </script>
</body>
</html>
