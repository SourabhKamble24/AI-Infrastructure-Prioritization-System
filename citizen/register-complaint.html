<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Issue - CivicSense</title>
  <link rel="stylesheet" href="../src/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="font-sans antialiased bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 transition-colors duration-300 min-h-screen flex flex-col">
  
  <!-- Navigation -->
  <nav class="glass-nav py-4 px-6 w-full fixed top-0 z-50">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <a href="../index.html" class="flex items-center gap-2">
        <div class="w-8 h-8 rounded bg-primary-600 flex items-center justify-center text-white font-bold text-xl">C</div>
        <span class="font-bold text-xl tracking-tight text-slate-900 dark:text-white">CivicSense</span>
      </a>
      <div class="flex items-center gap-4">
        <a href="dashboard.html" class="hover:text-primary-600 dark:hover:text-primary-400 font-medium transition-colors hidden md:block mr-4">Dashboard</a>
        <button id="theme-toggle" type="button" class="text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 focus:outline-none rounded-lg text-sm p-2.5">
          <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
          <svg id="theme-toggle-light-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path></svg>
        </button>
      </div>
    </div>
  </nav>

  <!-- Register Form Section -->
  <main class="flex-grow flex items-center justify-center pt-24 pb-12 px-4">
    <div class="glass-card w-full max-w-2xl">
      <div class="mb-8 border-b border-slate-200 dark:border-slate-700 pb-4">
        <h1 class="text-2xl font-bold text-slate-900 dark:text-white">Report New Issue</h1>
        <p class="text-slate-600 dark:text-slate-400 mt-1 text-sm">Please provide details about the infrastructure issue. Our AI will automatically categorize and prioritize it.</p>
      </div>
      
      <form id="complaintForm" class="space-y-6">
        
        <!-- Category Selection -->
        <div>
          <label for="category" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Issue Category</label>
          <select id="category" class="input-field" required>
            <option value="" disabled selected>Select a category...</option>
            <option value="pothole">Pothole</option>
            <option value="streetlight">Streetlight Outage</option>
            <option value="water_leak">Water Leakage</option>
            <option value="garbage">Garbage Accumulation</option>
            <option value="sidewalk">Broken Sidewalk</option>
            <option value="other">Other</option>
          </select>
        </div>

        <!-- Description -->
        <div>
          <label for="description" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Description</label>
          <textarea id="description" rows="4" class="input-field resize-none" placeholder="Describe the issue in detail..." required></textarea>
        </div>

        <!-- Location Info -->
        <div>
          <label for="address" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Location Address</label>
          <div class="relative">
            <input type="text" id="address" class="input-field" placeholder="Enter street address or landmark..." required>
            <input type="hidden" id="lat">
            <input type="hidden" id="lng">
          </div>
          <p class="text-xs text-slate-500 mt-2 text-right">
            <button type="button" id="getLocationBtn" class="text-primary-600 hover:underline inline-flex items-center gap-1">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg> 
              Use my current location
            </button>
          </p>
        </div>

        <!-- File Upload -->
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Upload Photo</label>
          <div class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-slate-300 dark:border-slate-600 border-dashed rounded-lg bg-slate-50 dark:bg-slate-800/50 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
            <div class="space-y-1 text-center">
              <svg class="mx-auto h-12 w-12 text-slate-400" stroke="currentColor" fill="none" viewBox="0 0 48 48" aria-hidden="true">
                <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
              <div class="flex text-sm text-slate-600 dark:text-slate-400 justify-center">
                <label for="file-upload" class="relative cursor-pointer bg-transparent rounded-md font-medium text-primary-600 dark:text-primary-400 hover:text-primary-500 focus-within:outline-none focus-within:ring-2 focus-within:ring-offset-2 focus-within:ring-primary-500">
                  <span>Upload a file</span>
                  <input id="file-upload" name="file-upload" type="file" class="sr-only">
                </label>
                <p class="pl-1">or drag and drop</p>
              </div>
              <p class="text-xs text-slate-500">PNG, JPG, GIF up to 10MB</p>
            </div>
          </div>
        </div>

        <div class="flex justify-end gap-3 pt-4">
          <button type="button" onclick="window.history.back()" class="px-5 py-2.5 rounded-lg border border-slate-300 dark:border-slate-600 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors text-sm font-medium">Cancel</button>
          <button type="submit" class="btn-primary">Submit Report</button>
        </div>
      </form>
    </div>
  </main>

  <script type="module" src="../src/js/main.js"></script>
  <script>
    // Geolocation logic
    const locationBtn = document.getElementById('getLocationBtn');
    const addressInput = document.getElementById('address');
    const latInput = document.getElementById('lat');
    const lngInput = document.getElementById('lng');

    locationBtn.addEventListener('click', () => {
      const originalText = locationBtn.innerHTML;
      locationBtn.innerHTML = 'Locating...';
      locationBtn.disabled = true;

      if (!navigator.geolocation) {
        alert('Geolocation is not supported by your browser');
        locationBtn.innerHTML = originalText;
        locationBtn.disabled = false;
        return;
      }

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          latInput.value = lat;
          lngInput.value = lng;
          
          try {
            // Reverse Geocoding using OpenStreetMap Nominatim
            const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);
            const data = await response.json();
            if (data && data.display_name) {
              addressInput.value = data.display_name;
            } else {
              addressInput.value = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
            }
          } catch (err) {
            addressInput.value = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
          }

          locationBtn.innerHTML = '<span class="text-green-600 font-bold">✓ Location Acquired</span>';
        },
        (error) => {
          console.error("Error getting location:", error);
          alert('Unable to retrieve your location. Please check browser permissions or type the address manually.');
          locationBtn.innerHTML = originalText;
          locationBtn.disabled = false;
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    });

    document.getElementById('complaintForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const submitBtn = e.target.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting...';

      const latValue = document.getElementById('lat').value;
      const lngValue = document.getElementById('lng').value;
      
      const data = {
        category_id: document.getElementById('category').value,
        description: document.getElementById('description').value + ' (Address: ' + document.getElementById('address').value + ')',
        lat: latValue ? parseFloat(latValue) : 28.6139,
        lng: lngValue ? parseFloat(lngValue) : 77.2090,
        reported_by: 'user123'
      };

      try {
        const token = localStorage.getItem('auth_token');
        if (!token) {
          if (window.showToast) window.showToast('You must be logged in to report an issue', 'error');
          else alert('You must be logged in to report an issue');
          setTimeout(() => window.location.href = '../login.html', 1500);
          return;
        }

        // Add user_id if available, otherwise fallback
        const userId = localStorage.getItem('user_id') || 'anonymous';
        data.reported_by = userId;

        const response = await fetch('http://localhost:5000/api/complaints', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify(data)
        });

        if (response.ok) {
          if (window.showToast) window.showToast('Complaint Registered Successfully!', 'success');
          else alert('Complaint Registered Successfully!');
          
          document.getElementById('complaintForm').reset();
          submitBtn.textContent = 'Report Issue';
          submitBtn.disabled = false;
          
          // Redirect to dashboard after a short delay
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 1500);
        } else {
          const errData = await response.json();
          if (window.showToast) window.showToast('Error: ' + JSON.stringify(errData), 'error');
          else alert('Error: ' + JSON.stringify(errData));
          
          submitBtn.textContent = 'Report Issue';
          submitBtn.disabled = false;
        }
      } catch (error) {
        console.error("Error submitting:", error);
        if (window.showToast) window.showToast('Error submitting report. Is the backend running?', 'error');
        else alert('Error submitting report. Is the backend running?');
        submitBtn.textContent = 'Report Issue';
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
