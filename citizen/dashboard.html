<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Citizen Dashboard - CivicTriage</title>
  <link rel="stylesheet" href="../src/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="font-sans antialiased bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 transition-colors duration-300 min-h-screen flex flex-col">
  
  <!-- Navigation -->
  <nav class="glass-nav py-4 px-6 w-full fixed top-0 z-50">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <a href="../index.html" class="flex items-center gap-2">
        <div class="w-8 h-8 rounded bg-primary-600 flex items-center justify-center text-white font-bold text-xl">C</div>
        <span class="font-bold text-xl tracking-tight text-slate-900 dark:text-white">CivicTriage</span>
      </a>
      <div class="flex items-center gap-4">
        <a href="../map.html" class="hover:text-primary-600 dark:hover:text-primary-400 font-medium transition-colors hidden md:block mr-4">Live Map</a>
        <button id="theme-toggle" type="button" class="text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 focus:outline-none rounded-lg text-sm p-2.5">
          <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
          <svg id="theme-toggle-light-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path></svg>
        </button>
        <a href="../login.html" class="text-slate-600 dark:text-slate-300 font-medium hover:text-primary-600 dark:hover:text-primary-400">Logout</a>
      </div>
    </div>
  </nav>

  <!-- Dashboard Section -->
  <main class="flex-grow pt-24 pb-12 px-4 max-w-7xl mx-auto w-full">
    <div class="flex justify-between items-end mb-8">
      <div>
        <h1 class="text-3xl font-bold text-slate-900 dark:text-white">My Dashboard</h1>
        <p class="text-slate-600 dark:text-slate-400 mt-2">Track the status of your reported issues</p>
      </div>
      <a href="register-complaint.html" class="btn-primary">
        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
        Report New Issue
      </a>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      <!-- Stats Sidebar -->
      <div class="lg:col-span-1 space-y-6">
        <div class="glass-card p-6 bg-white dark:bg-slate-800 shadow-xl shadow-slate-200/50 dark:shadow-slate-900/50 border border-slate-100 dark:border-slate-700/50 rounded-2xl">
          <h2 class="text-xl font-bold mb-6 text-slate-800 dark:text-white flex items-center gap-2">
            <svg class="w-5 h-5 text-primary-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
            Overview
          </h2>
          <div class="space-y-4">
            <div class="flex justify-between items-center p-3 rounded-xl bg-slate-50 dark:bg-slate-900/50 border border-slate-100 dark:border-slate-800">
              <span class="text-slate-600 dark:text-slate-400 font-medium">Total Reported</span>
              <span class="font-black text-2xl text-primary-600 dark:text-primary-400" id="stat-total">0</span>
            </div>
            <div class="flex justify-between items-center p-3 rounded-xl bg-yellow-50 dark:bg-yellow-900/10 border border-yellow-100 dark:border-yellow-900/30">
              <span class="text-yellow-700 dark:text-yellow-500 font-medium">In Progress</span>
              <span class="font-black text-2xl text-yellow-600 dark:text-yellow-400" id="stat-progress">0</span>
            </div>
            <div class="flex justify-between items-center p-3 rounded-xl bg-green-50 dark:bg-green-900/10 border border-green-100 dark:border-green-900/30">
              <span class="text-green-700 dark:text-green-500 font-medium">Resolved</span>
              <span class="font-black text-2xl text-green-600 dark:text-green-400" id="stat-resolved">0</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Issues List -->
      <div class="lg:col-span-2">
        <div class="glass-card p-6 bg-white dark:bg-slate-800 shadow-xl shadow-slate-200/50 dark:shadow-slate-900/50 border border-slate-100 dark:border-slate-700/50 rounded-2xl">
          <h2 class="text-xl font-bold mb-6 text-slate-800 dark:text-white flex items-center gap-2">
            <svg class="w-5 h-5 text-primary-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            Recent Reports
          </h2>
          <div id="citizenIssuesList" class="space-y-5">
            <!-- Dynamically populated issues will go here -->
          </div>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="../src/js/main.js"></script>
  <script type="module">
    import { CATEGORIES } from '../src/js/ai-models.js';

    document.addEventListener('DOMContentLoaded', async () => {
      const token = localStorage.getItem('auth_token');
      const userId = localStorage.getItem('user_id');
      if (!token || !userId) {
        window.location.href = '../login.html';
        return;
      }

      const issuesContainer = document.getElementById('citizenIssuesList');
      
      try {
        issuesContainer.innerHTML = '<div class="flex justify-center py-8"><div class="animate-spin rounded-full h-8 w-8 border-b-2 border-primary-600"></div></div>';
        const response = await fetch('http://localhost:5000/api/complaints');
        if (!response.ok) throw new Error('Failed to fetch');
        
        let allIssues = await response.json();
        // Filter issues to only show ones reported by this user
        // Fallback to empty array if none
        const myIssues = allIssues.filter(i => i.reported_by === userId) || [];
        
        // Update stats dynamically
        document.getElementById('stat-total').innerText = myIssues.length;
        document.getElementById('stat-progress').innerText = myIssues.filter(i => i.status === 'in progress').length;
        document.getElementById('stat-resolved').innerText = myIssues.filter(i => i.status === 'resolved').length;
        
        if (myIssues.length === 0) {
          issuesContainer.innerHTML = `
            <div class="text-center py-12 px-4 border-2 border-dashed border-slate-200 dark:border-slate-700 rounded-xl">
              <svg class="w-12 h-12 text-slate-300 dark:text-slate-600 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path></svg>
              <div class="text-slate-500 font-medium mb-2">No complaints filed yet.</div>
              <a href="register-complaint.html" class="text-primary-600 hover:text-primary-700 hover:underline font-semibold">Report your first issue</a>
            </div>
          `;
          return;
        }

        function getStatusBadge(status) {
          if (status === 'resolved') return '<span class="px-3 py-1 text-xs font-bold rounded-full bg-gradient-to-r from-green-500 to-emerald-400 text-white shadow-sm shadow-green-200 dark:shadow-none">RESOLVED</span>';
          if (status === 'in progress') return '<span class="px-3 py-1 text-xs font-bold rounded-full bg-gradient-to-r from-yellow-500 to-amber-400 text-white shadow-sm shadow-yellow-200 dark:shadow-none">IN PROGRESS</span>';
          return '<span class="px-3 py-1 text-xs font-bold rounded-full bg-gradient-to-r from-blue-500 to-indigo-400 text-white shadow-sm shadow-blue-200 dark:shadow-none">OPEN</span>';
        }

        const html = myIssues.map(issue => {
          const catLabel = CATEGORIES.find(c => c.id === issue.category_id)?.label || issue.category_id;
          return `
            <div class="group border border-slate-100 dark:border-slate-700 bg-white dark:bg-slate-800/50 rounded-xl p-5 hover:border-primary-300 dark:hover:border-primary-500/50 hover:shadow-lg hover:shadow-primary-500/5 dark:hover:shadow-none transition-all duration-300 transform hover:-translate-y-1 relative overflow-hidden">
              <div class="absolute top-0 right-0 bg-gradient-to-l from-primary-500 to-blue-500 text-white text-[9px] font-extrabold px-3 py-1 rounded-bl-lg uppercase tracking-widest shadow-sm">AI Verified</div>
              
              <div class="flex justify-between items-start mb-3 mt-1">
                <h3 class="font-bold text-xl text-slate-900 dark:text-white group-hover:text-primary-600 dark:group-hover:text-primary-400 transition-colors">${catLabel}</h3>
                <div class="mt-1">${getStatusBadge(issue.status)}</div>
              </div>
              
              <p class="text-slate-600 dark:text-slate-400 text-sm mb-4 leading-relaxed line-clamp-2">${issue.description}</p>
              
              <div class="flex justify-between items-center text-xs text-slate-500 bg-slate-50 dark:bg-slate-900/80 px-4 py-3 rounded-lg border border-slate-100 dark:border-slate-700/50">
                <span class="flex items-center gap-1"><svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg> ${new Date(issue.created_at).toLocaleDateString()}</span>
                <span class="flex items-center gap-3">
                  <span class="flex items-center gap-1">Priority: <strong class="${issue.priority === 'Critical' ? 'text-red-500' : issue.priority === 'High' ? 'text-orange-500' : 'text-slate-700 dark:text-slate-300'}">${issue.priority}</strong></span>
                  <span class="border-l border-slate-300 dark:border-slate-600 pl-3 flex items-center gap-1">Severity: <strong class="text-primary-600 dark:text-primary-400">${issue.severity_score}/100</strong></span>
                </span>
              </div>
            </div>
          `;
        }).join('');
        
        issuesContainer.innerHTML = html;
      } catch (err) {
        console.error(err);
        issuesContainer.innerHTML = '<div class="text-center text-red-500 py-4">Error loading data from backend</div>';
      }
    });
  </script>
</body>
</html>
