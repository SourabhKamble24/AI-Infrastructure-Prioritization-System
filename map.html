<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Issue Map - CivicSense</title>
  <link rel="stylesheet" href="./src/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
</head>
<body class="font-sans antialiased bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 transition-colors duration-300 min-h-screen flex flex-col">
  
  <!-- Navigation -->
  <nav class="glass-nav py-4 px-6 w-full fixed top-0 z-50">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <a href="/index.html" class="flex items-center gap-2">
        <div class="w-8 h-8 rounded bg-primary-600 flex items-center justify-center text-white font-bold text-xl">C</div>
        <span class="font-bold text-xl tracking-tight text-slate-900 dark:text-white">CivicSense</span>
      </a>
      <div class="flex items-center gap-4">
        <a href="/index.html" class="hover:text-primary-600 dark:hover:text-primary-400 font-medium transition-colors hidden md:block mr-4">Home</a>
        <button id="theme-toggle" type="button" class="text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 focus:outline-none rounded-lg text-sm p-2.5">
          <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
          <svg id="theme-toggle-light-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path></svg>
        </button>
        <a href="/citizen/register-complaint.html" class="btn-primary">Report an Issue</a>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="flex-grow pt-24 pb-4 px-4 w-full h-screen flex flex-col">
    <div class="max-w-7xl mx-auto w-full mb-4">
      <h1 class="text-3xl font-bold text-slate-900 dark:text-white">Public Issue Map</h1>
      <p class="text-slate-600 dark:text-slate-400 mt-1">Live view of all reported infrastructure issues prioritized by AI.</p>
    </div>
    
    <div class="max-w-7xl mx-auto w-full flex-grow glass-card p-2 flex flex-col relative">
      <!-- Filter Overlay -->
      <div class="absolute top-6 right-6 z-[1000] glass p-4 rounded-lg shadow-md max-w-xs w-full">
        <h3 class="font-bold text-sm mb-3">Priority Filters</h3>
        <div class="space-y-2">
          <label class="flex items-center space-x-2 text-sm cursor-pointer">
            <input type="checkbox" checked class="rounded border-gray-300 text-red-500 focus:ring-red-500" value="Critical">
            <span class="flex items-center"><span class="w-3 h-3 rounded-full bg-red-500 mr-2"></span> Critical</span>
          </label>
          <label class="flex items-center space-x-2 text-sm cursor-pointer">
            <input type="checkbox" checked class="rounded border-gray-300 text-orange-500 focus:ring-orange-500" value="High">
            <span class="flex items-center"><span class="w-3 h-3 rounded-full bg-orange-500 mr-2"></span> High</span>
          </label>
          <label class="flex items-center space-x-2 text-sm cursor-pointer">
            <input type="checkbox" checked class="rounded border-gray-300 text-yellow-500 focus:ring-yellow-500" value="Medium">
            <span class="flex items-center"><span class="w-3 h-3 rounded-full bg-yellow-500 mr-2"></span> Medium</span>
          </label>
          <label class="flex items-center space-x-2 text-sm cursor-pointer">
            <input type="checkbox" checked class="rounded border-gray-300 text-green-500 focus:ring-green-500" value="Low">
            <span class="flex items-center"><span class="w-3 h-3 rounded-full bg-green-500 mr-2"></span> Low</span>
          </label>
        </div>
      </div>
      
      <!-- Map Container -->
      <div id="fullMap" style="min-height: 70vh;" class="w-full h-full rounded-lg z-0 relative"></div>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="./src/js/main.js"></script>
  <script type="module">
    import { CATEGORIES } from './src/js/ai-models.js';

    document.addEventListener('DOMContentLoaded', async () => {
      const fullMap = L.map('fullMap').setView([28.6139, 77.2090], 12);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
      }).addTo(fullMap);

      let markers = [];
      let currentIssues = [];
      
      try {
        const response = await fetch('http://localhost:5000/api/complaints');
        if (!response.ok) throw new Error('Network error');
        currentIssues = await response.json();
      } catch (err) {
        console.error("Error loading map data:", err);
        currentIssues = [];
      }

      function getMarkerColor(priority) {
        switch (priority) {
          case 'Critical': return '#ef4444';
          case 'High': return '#f97316';
          case 'Medium': return '#eab308';
          case 'Low': return '#22c55e';
          default: return '#3b82f6';
        }
      }

      function createCustomIcon(color) {
        return L.divIcon({
          className: 'custom-div-icon',
          html: `<div style='background-color:${color}; width:20px; height:20px; border-radius:50%; border:3px solid white; box-shadow: 0 0 4px rgba(0,0,0,0.5);'></div>`,
          iconSize: [20, 20],
          iconAnchor: [10, 10]
        });
      }

      function renderMarkers() {
        // clear existing markers
        markers.forEach(m => fullMap.removeLayer(m));
        markers = [];
        
        // Get active filters
        const checkboxes = document.querySelectorAll('input[type="checkbox"]:checked');
        const activePriorities = Array.from(checkboxes).map(cb => cb.value);

        currentIssues.forEach(issue => {
          if (activePriorities.includes(issue.priority)) {
            const catLabel = CATEGORIES.find(c => c.id === issue.category_id)?.label || issue.category_id;
            const marker = L.marker([issue.lat, issue.lng], {
              icon: createCustomIcon(getMarkerColor(issue.priority))
            }).addTo(fullMap).bindPopup(`
              <div class="min-w-[150px] font-sans">
                <div class="flex justify-between items-start mb-2">
                  <span class="inline-block px-2 py-1 text-[10px] font-bold text-white rounded uppercase tracking-wider" style="background-color: ${getMarkerColor(issue.priority)}">
                    ${issue.priority}
                  </span>
                  ${issue.ai_verified ? '<span class="text-[10px] font-bold text-primary-600 bg-primary-50 px-1.5 py-0.5 rounded border border-primary-200">AI Verified ✓</span>' : ''}
                </div>
                <b class="text-slate-900">${catLabel}</b>
                <p class="text-sm mt-1 text-slate-600">${issue.description}</p>
                <div class="mt-2 pt-2 border-t border-slate-200 grid grid-cols-2 gap-2 text-xs">
                  <div>
                    <span class="block text-slate-400">Status</span>
                    <span class="font-medium text-slate-700">${issue.status.toUpperCase()}</span>
                  </div>
                  <div>
                    <span class="block text-slate-400">Severity</span>
                    <span class="font-bold text-slate-800">${issue.severity_score}/100</span>
                  </div>
                </div>
              </div>
            `);
            markers.push(marker);
          }
        });
        
        // Auto-zoom map to show all markers
        if (markers.length > 0) {
          const group = new L.featureGroup(markers);
          fullMap.fitBounds(group.getBounds(), { padding: [50, 50], maxZoom: 15 });
        }
      }

      // Initial render
      renderMarkers();

      // Fix Leaflet grey tile rendering bug on load
      setTimeout(() => {
        fullMap.invalidateSize();
        // If there were no markers initially (or data took long to fetch), re-center just in case
        if (markers.length > 0) {
           const group = new L.featureGroup(markers);
           fullMap.fitBounds(group.getBounds(), { padding: [50, 50], maxZoom: 15 });
        }
      }, 300);

      // Listen for filter changes
      document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
        cb.addEventListener('change', renderMarkers);
      });
    });
  </script>
</body>
</html>
